<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>귀여운 카페 경영 게임 - 스테이지 1</title>
    <style>
        /* 기본 설정 및 폰트 */
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
        
        :root {
            --bg-color: #f4ead5;
            --border-color: #5c3a21;
            --btn-green: #9ccb96;
            --btn-red: #ea8d8a;
            --cup-color: #8ebbd0;
            --text-color: #5c3a21;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #333;
            font-family: 'Jua', sans-serif;
            user-select: none;
            overflow: hidden; /* 스크롤 방지 */
        }

        /* 게임 화면 컨테이너 (고정 해상도) */
        #game-container {
            width: 800px;
            height: 600px;
            background-color: var(--bg-color);
            position: relative;
            border-radius: 20px;
            border: 6px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
            color: var(--text-color);
        }

        /* 공통 테두리 스타일 */
        .thick-border {
            border: 4px solid var(--border-color);
            border-radius: 15px;
            background-color: white;
        }

        /* 상단 UI (돈, 시간, 목숨) */
        #top-bar {
            display: flex;
            justify-content: space-between;
            padding: 15px 30px;
            font-size: 24px;
        }

        .status-box {
            padding: 5px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
        }

        /* 손님 영역 */
        #customer-area {
            position: absolute;
            left: 50px;
            top: 130px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 200px;
        }

        #speech-bubble {
            width: 180px;
            padding: 15px;
            text-align: center;
            font-size: 20px;
            position: relative;
            margin-bottom: 20px;
            border-radius: 20px;
        }
        
        #speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 15px 10px 0;
            border-style: solid;
            border-color: var(--border-color) transparent transparent transparent;
        }
        #speech-bubble::before {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 12px 8px 0;
            border-style: solid;
            border-color: white transparent transparent transparent;
            z-index: 1;
        }

        #customer-emoji {
            font-size: 80px;
            line-height: 1;
            margin-bottom: 20px;
            text-shadow: 0 4px 0 rgba(0,0,0,0.2);
        }

        /* 인내심 게이지 */
        #patience-bar-container {
            width: 100%;
            height: 20px;
            background-color: #d1d5db;
            border: 4px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 5px;
        }

        #patience-bar {
            width: 100%;
            height: 100%;
            background-color: #e57373;
            transition: width 0.1s linear, background-color 0.3s;
        }
        
        .patience-label {
            background-color: white;
            padding: 2px 15px;
            border-radius: 10px;
            border: 3px solid var(--border-color);
            font-size: 14px;
        }

        /* 중앙 컵 영역 */
        #cup-area {
            position: absolute;
            left: 300px;
            top: 200px;
            width: 160px;
            height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #cup {
            width: 120px;
            height: 140px;
            border: 6px solid var(--cup-color);
            border-top: none;
            border-radius: 0 0 20px 20px;
            position: relative;
            background-color: rgba(255,255,255,0.5);
            z-index: 2;
        }

        /* 컵 손잡이 */
        #cup::after {
            content: '';
            position: absolute;
            right: -36px;
            top: 20px;
            width: 30px;
            height: 60px;
            border: 6px solid var(--cup-color);
            border-left: none;
            border-radius: 0 30px 30px 0;
        }

        #liquid {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 0%;
            background-color: transparent;
            border-radius: 0 0 14px 14px;
            transition: height 0.3s ease, background-color 0.4s ease;
            z-index: 1;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-end;
            justify-content: center;
            overflow: hidden;
        }

        .ice-cube {
            font-size: 24px;
            margin: 2px;
            animation: float 2s infinite ease-in-out alternate;
        }

        @keyframes float {
            from { transform: translateY(0); }
            to { transform: translateY(-5px); }
        }

        #coaster {
            width: 140px;
            height: 20px;
            background-color: #a06b49;
            border: 4px solid var(--border-color);
            border-radius: 50%;
            margin-top: -10px;
            z-index: 1;
        }

        /* 우측 레시피 및 재료 영역 */
        #right-area {
            position: absolute;
            right: 30px;
            top: 80px;
            width: 220px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        #recipe-board {
            padding: 15px;
            background-color: white;
            font-size: 16px;
        }
        
        #recipe-board h3 {
            margin: 0 0 10px 0;
            text-align: center;
            color: #d86c6c;
        }

        .recipe-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed #ccc;
            padding: 5px 0;
        }
        .recipe-item:last-child {
            border-bottom: none;
        }

        .ingredient-btn {
            padding: 10px;
            font-size: 20px;
            font-family: 'Jua', sans-serif;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 5px 0 var(--border-color);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .ingredient-btn:active {
            transform: translateY(5px);
            box-shadow: 0 0 0 var(--border-color);
        }

        /* 하단 테이블과 버튼 */
        #table-line {
            position: absolute;
            bottom: 110px;
            left: 20px;
            width: 760px;
            height: 10px;
            background-color: #8b5a33;
            border: 3px solid var(--border-color);
            border-radius: 5px;
        }

        #bottom-buttons {
            position: absolute;
            bottom: 25px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        .action-btn {
            width: 320px;
            padding: 15px;
            font-size: 28px;
            font-family: 'Jua', sans-serif;
            color: var(--text-color);
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 6px 0 var(--border-color);
            transition: transform 0.1s, box-shadow 0.1s;
        }
        
        .action-btn:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 var(--border-color);
        }

        #btn-serve { background-color: var(--btn-green); }
        #btn-trash { background-color: var(--btn-red); }

        /* 화면 오버레이 (시작, 종료) */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(244, 234, 213, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .overlay h1 {
            font-size: 48px;
            margin-bottom: 10px;
            color: var(--text-color);
            text-shadow: 2px 2px 0 white;
        }
        
        .overlay p {
            font-size: 20px;
            text-align: center;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .start-btn {
            padding: 15px 40px;
            font-size: 28px;
            background-color: var(--btn-green);
            color: var(--text-color);
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 6px 0 var(--border-color);
            font-family: 'Jua', sans-serif;
        }

        .hidden { display: none !important; }
        
        /* 이펙트 애니메이션 */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }
        .shake-anim { animation: shake 0.3s ease-in-out; }

    </style>
</head>
<body>

<div id="game-container">
    
    <!-- 상단 상태바 -->
    <div id="top-bar">
        <div class="status-box thick-border">
            <span>💰</span> <span id="ui-money">0원</span>
        </div>
        <div style="display: flex; gap: 15px;">
            <div class="status-box thick-border">
                <span>⏱️</span> <span id="ui-time">120초</span>
            </div>
            <div class="status-box thick-border" id="ui-hearts">
                ❤️❤️❤️
            </div>
        </div>
    </div>

    <!-- 좌측 손님 영역 -->
    <div id="customer-area" class="hidden">
        <div id="speech-bubble" class="thick-border">
            <span id="customer-order-text">카페라떼<br>부탁해요!</span>
        </div>
        <div id="customer-emoji">👱</div>
        <div id="patience-bar-container">
            <div id="patience-bar"></div>
        </div>
        <div class="patience-label">인내심</div>
    </div>

    <!-- 중앙 컵 영역 -->
    <div id="cup-area">
        <div id="cup">
            <div id="liquid"></div>
        </div>
        <div id="coaster"></div>
    </div>

    <!-- 우측 레시피 및 재료 -->
    <div id="right-area">
        <div id="recipe-board" class="thick-border">
            <h3>📜 레시피</h3>
            <div class="recipe-item">
                <span>에스프레소</span> <span>☕</span>
            </div>
            <div class="recipe-item">
                <span>카페라떼</span> <span>☕+🥛</span>
            </div>
            <div class="recipe-item">
                <span>아이스 라떼</span> <span>☕+🥛+🧊</span>
            </div>
        </div>
        
        <button class="ingredient-btn thick-border" onclick="addIngredient('espresso')">
            ☕ 에스프레소
        </button>
        <button class="ingredient-btn thick-border" onclick="addIngredient('milk')">
            🥛 우유
        </button>
        <button class="ingredient-btn thick-border" onclick="addIngredient('ice')">
            🧊 얼음
        </button>
    </div>

    <!-- 하단 테이블과 버튼 -->
    <div id="table-line"></div>
    <div id="bottom-buttons">
        <button id="btn-serve" class="action-btn thick-border" onclick="serveDrink()">
            🌿 서빙하기
        </button>
        <button id="btn-trash" class="action-btn thick-border" onclick="throwAway()">
            🗑️ 버리기
        </button>
    </div>

    <!-- 시작 화면 -->
    <div id="start-screen" class="overlay">
        <h1>☕ 낭만 카페 영업시작</h1>
        <p>
            재료를 조합해 손님이 원하는 음료를 만드세요!<br>
            <strong>클리어 목표:</strong> 120초 안에 1,000원 이상 벌기<br>
            <strong>실패 조건:</strong> 시간 내 목표 미달 또는 손님 3명 놓치기<br>
            (마우스로 클릭해서 플레이합니다)
        </p>
        <button class="start-btn thick-border" onclick="startGame()">영업 시작하기</button>
    </div>

    <!-- 결과 화면 -->
    <div id="result-screen" class="overlay hidden">
        <h1 id="result-title">영업 종료</h1>
        <h2 id="result-stars" style="font-size: 40px; margin: 10px 0;">⭐⭐⭐</h2>
        <p id="result-desc">총 수익: 0원</p>
        <button class="start-btn thick-border" onclick="resetGame()">다시 하기</button>
    </div>

</div>

<script>
    /* =========================================
       [설정값] 기획서에 명시되지 않아 임의로 정한 수치들
       ========================================= */
    const CONFIG = {
        GAME_TIME_SEC: 120,       // 전체 게임 시간 (기획서 120초)
        MAX_HEARTS: 3,            // 목숨 개수 (기획서 3개)
        DRINK_PRICE: 250,         // 음료 1잔 기본 가격 (1000원을 달성하기 위해 4잔 서빙 필요)
        PATIENCE_SEC: 20,         // 손님 한 명이 기다려주는 시간 (20초)
        MAX_INGREDIENTS: 3,       // 컵에 담을 수 있는 최대 재료 수
        STAR1_GOAL: 1000,         // 별 1개 조건 (기획서 기준)
        STAR2_GOAL: 2000,         // 별 2개 조건
        STAR3_GOAL: 3000          // 별 3개 조건
    };

    /* =========================================
       레시피 데이터 (색상 변화 구현)
       ========================================= */
    const RECIPES = [
        { id: 'espresso', name: '에스프레소', ingredients: ['espresso'], color: '#3e2723', requestText: '에스프레소<br>부탁해요!' },
        { id: 'cafelatte', name: '카페라떼', ingredients: ['espresso', 'milk'], color: '#d7ccc8', requestText: '카페라떼<br>부탁해요!' },
        { id: 'icedlatte', name: '아이스 라떼', ingredients: ['espresso', 'milk', 'ice'], color: '#d7ccc8', requestText: '아이스 라떼<br>부탁해요!' }
    ];

    const CUSTOMER_FACES = ['👱', '👩', '👨', '👧', '👵', '🧔'];

    /* =========================================
       게임 상태 변수
       ========================================= */
    let currentMoney = 0;
    let timeLeft = CONFIG.GAME_TIME_SEC;
    let hearts = CONFIG.MAX_HEARTS;
    
    let currentCup = []; // 현재 컵에 담긴 재료 배열
    let currentOrder = null; // 현재 손님이 주문한 레시피 객체
    let customerTimer = 0; // 손님 인내심 게이지용 (밀리초)
    let patienceInterval = null;
    let gameTimerInterval = null;
    let isPlaying = false;

    /* =========================================
       DOM 요소 캐싱
       ========================================= */
    const uiMoney = document.getElementById('ui-money');
    const uiTime = document.getElementById('ui-time');
    const uiHearts = document.getElementById('ui-hearts');
    const liquidDiv = document.getElementById('liquid');
    const customerArea = document.getElementById('customer-area');
    const customerOrderText = document.getElementById('customer-order-text');
    const customerEmoji = document.getElementById('customer-emoji');
    const patienceBar = document.getElementById('patience-bar');
    const startScreen = document.getElementById('start-screen');
    const resultScreen = document.getElementById('result-screen');
    const resultTitle = document.getElementById('result-title');
    const resultStars = document.getElementById('result-stars');
    const resultDesc = document.getElementById('result-desc');

    /* =========================================
       게임 초기화 및 시작 로직
       ========================================= */
    function startGame() {
        startScreen.classList.add('hidden');
        resetGameData();
        isPlaying = true;
        updateUI();
        spawnCustomer();
        
        // 전체 게임 타이머 (1초마다 감소)
        gameTimerInterval = setInterval(() => {
            if (!isPlaying) return;
            timeLeft--;
            updateUI();
            if (timeLeft <= 0) {
                endGame(true); // 시간 종료로 인한 게임 오버(정산)
            }
        }, 1000);
    }

    function resetGameData() {
        currentMoney = 0;
        timeLeft = CONFIG.GAME_TIME_SEC;
        hearts = CONFIG.MAX_HEARTS;
        currentCup = [];
        updateCupVisual();
    }

    function updateUI() {
        uiMoney.innerText = `${currentMoney}원`;
        uiTime.innerText = `${timeLeft}초`;
        
        let heartStr = '';
        for(let i=0; i<hearts; i++) heartStr += '❤️';
        for(let i=hearts; i<CONFIG.MAX_HEARTS; i++) heartStr += '🖤';
        uiHearts.innerText = heartStr;
    }

    /* =========================================
       손님 로직 (생성, 인내심 감소, 놓침)
       ========================================= */
    function spawnCustomer() {
        customerArea.classList.remove('hidden');
        
        // 랜덤 레시피와 얼굴 지정
        currentOrder = RECIPES[Math.floor(Math.random() * RECIPES.length)];
        customerEmoji.innerText = CUSTOMER_FACES[Math.floor(Math.random() * CUSTOMER_FACES.length)];
        customerOrderText.innerHTML = currentOrder.requestText;
        
        // 인내심 초기화
        customerTimer = CONFIG.PATIENCE_SEC * 1000;
        patienceBar.style.width = '100%';
        patienceBar.style.backgroundColor = '#e57373'; // 초기 붉은색

        clearInterval(patienceInterval);
        patienceInterval = setInterval(() => {
            if (!isPlaying) return;
            customerTimer -= 50; // 50ms 마다 갱신하여 부드럽게 줄어들게 함
            let percent = (customerTimer / (CONFIG.PATIENCE_SEC * 1000)) * 100;
            patienceBar.style.width = `${percent}%`;

            // 시간이 얼마 안 남으면 주황색 경고
            if (percent < 30) patienceBar.style.backgroundColor = '#ff9800';

            if (customerTimer <= 0) {
                missCustomer();
            }
        }, 50);
    }

    function missCustomer() {
        clearInterval(patienceInterval);
        customerEmoji.innerText = '💢'; // 화난 표정
        customerOrderText.innerHTML = "너무 늦어!<br>갈래!";
        
        setTimeout(() => {
            hearts--;
            updateUI();
            if (hearts <= 0) {
                endGame(false); // 목숨 소진으로 즉시 실패
            } else {
                spawnCustomer(); // 다음 손님 등장
            }
        }, 1000);
    }

    /* =========================================
       음료 제작 로직 (재료 넣기, 색상 섞기)
       ========================================= */
    function addIngredient(ingName) {
        if (!isPlaying || currentCup.length >= CONFIG.MAX_INGREDIENTS) return;
        
        currentCup.push(ingName);
        updateCupVisual();
    }

    function updateCupVisual() {
        const fillPercent = (currentCup.length / CONFIG.MAX_INGREDIENTS) * 100;
        liquidDiv.style.height = `${fillPercent}%`;
        
        // 색상 섞기 결정
        let hasEspresso = currentCup.includes('espresso');
        let hasMilk = currentCup.includes('milk');
        let hasIce = currentCup.includes('ice');

        liquidDiv.innerHTML = ''; // 얼음 초기화

        if (currentCup.length === 0) {
            liquidDiv.style.backgroundColor = 'transparent';
        } else {
            // 커피와 우유가 섞이는 시각적 효과 구현
            if (hasEspresso && hasMilk) liquidDiv.style.backgroundColor = '#d7ccc8'; // 라떼 색
            else if (hasMilk && !hasEspresso) liquidDiv.style.backgroundColor = '#ffffff'; // 우유 색
            else if (hasEspresso && !hasMilk) liquidDiv.style.backgroundColor = '#3e2723'; // 에스프레소 색
            else liquidDiv.style.backgroundColor = '#e0f7fa'; // 얼음만 있을때 물 느낌
            
            // 얼음이 있다면 시각적으로 추가
            if (hasIce) {
                let iceCount = currentCup.filter(i => i === 'ice').length;
                for(let i=0; i<iceCount * 2; i++) {
                    let ice = document.createElement('div');
                    ice.className = 'ice-cube';
                    ice.innerText = '🧊';
                    liquidDiv.appendChild(ice);
                }
            }
        }
    }

    /* =========================================
       서빙 및 버리기 로직
       ========================================= */
    function serveDrink() {
        if (!isPlaying || currentCup.length === 0 || !currentOrder) return;

        // 재료 배열을 정렬하여 순서 상관없이 조합만 맞으면 정답 처리
        let cupSorted = [...currentCup].sort().join(',');
        let orderSorted = [...currentOrder.ingredients].sort().join(',');

        if (cupSorted === orderSorted) {
            // 정답!
            clearInterval(patienceInterval);
            currentMoney += CONFIG.DRINK_PRICE;
            updateUI();
            
            customerEmoji.innerText = '😍';
            customerOrderText.innerHTML = "완벽해요!<br>고마워요!";
            
            throwAway(); // 컵 비우기
            
            setTimeout(() => {
                if(isPlaying) spawnCustomer();
            }, 800);
        } else {
            // 오답! (기획서에 오답 페널티가 없으므로 컵만 흔들림 효과)
            document.getElementById('cup').classList.add('shake-anim');
            setTimeout(() => document.getElementById('cup').classList.remove('shake-anim'), 300);
        }
    }

    function throwAway() {
        if (!isPlaying) return;
        currentCup = [];
        updateCupVisual();
    }

    /* =========================================
       게임 종료 및 정산
       ========================================= */
    function endGame(isTimeOver) {
        isPlaying = false;
        clearInterval(patienceInterval);
        clearInterval(gameTimerInterval);
        
        customerArea.classList.add('hidden');
        resultScreen.classList.remove('hidden');
        
        if (hearts <= 0) {
            // 실패 조건 2: 손님이 화내며 나가서 하트가 다 닳았을 때
            resultTitle.innerText = "영업 실패...";
            resultStars.innerText = "💔💔💔";
            resultDesc.innerText = "손님들이 화가 나서 다 가버렸어요.\n벌어들인 돈: " + currentMoney + "원";
        } else {
            // 시간 종료 정산
            if (currentMoney >= CONFIG.STAR3_GOAL) {
                resultTitle.innerText = "영업 대성공!";
                resultStars.innerText = "⭐⭐⭐";
            } else if (currentMoney >= CONFIG.STAR2_GOAL) {
                resultTitle.innerText = "영업 성공!";
                resultStars.innerText = "⭐⭐";
            } else if (currentMoney >= CONFIG.STAR1_GOAL) {
                resultTitle.innerText = "무난한 하루!";
                resultStars.innerText = "⭐";
            } else {
                // 실패 조건 1: 1000원을 못 벌었을 때
                resultTitle.innerText = "영업 실패...";
                resultStars.innerText = "목표 금액 미달";
            }
            resultDesc.innerText = `총 수익: ${currentMoney}원\n목표치(1000원) 대비 훌륭해요!`;
        }
    }

    function resetGame() {
        resultScreen.classList.add('hidden');
        startScreen.classList.remove('hidden');
    }

    // 키보드 스페이스 및 방향키 스크롤 방지
    window.addEventListener('keydown', function(e) {
        if([32, 37, 38, 39, 40].indexOf(e.keyCode) > -1) {
            e.preventDefault();
        }
    }, false);

</script>

</body>
</html>
